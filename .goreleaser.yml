---
version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: serverbeacon-api
    main: ./cmd/api
    binary: serverbeacon-api
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: serverbeacon-api-archive
    builds: [serverbeacon-api]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64{{ end }}
    files:
      - README.md
      # - LICENSE*
      # - config/config.example.toml

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

dist: dist

release:
  github:
    owner: redjax
    name: serverbeacon
  draft: false
  prerelease: auto

dockers:
  - ids:
      - serverbeacon-api
    image_templates:
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/serverbeacon-api:{{ .Tag }}"
      - "ghcr.io/{{ .Env.GITHUB_REPOSITORY_OWNER }}/serverbeacon-api:latest"
    dockerfile: Dockerfile
    skip_push: '{{ ne .Env.GITHUB_ACTIONS "true" }}' # Only do Docker release if running in a Github Actions
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64,linux/arm64"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.revision={{ .Commit }}"
      - '--label=org.opencontainers.image.created={{ time "2006-01-02T15:04:05Z07:00" }}'
      - "--label=org.opencontainers.image.source={{ .GitURL }}"
