---
version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: serverbeacon-api
    main: ./cmd/api
    binary: serverbeacon-api
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: serverbeacon-api-archive
    ids: [serverbeacon-api]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64{{ end }}
    files:
      - README.md
      # - license*
      # - config/config.example.toml

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - merge pull request
      - merge branch

dist: dist

release:
  github:
    owner: redjax
    name: serverbeacon
  draft: false
  prerelease: auto

