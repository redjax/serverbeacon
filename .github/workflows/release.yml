---
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump level (major/minor/patch), or leave empty for auto"
        required: false
        type: choice
        options:
          - ""
          - major
          - minor
          - patch
        default: ""

permissions: {}

jobs:
  ## Build & release Go apps
  goreleaser:
    permissions:
      contents: write # git tag creation
      issues: write # changelog links
      pull-requests: write # changelog links
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version & create tag
        id: version
        run: |
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: "release --clean"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ## Build Docker images
  docker:
    permissions:
      packages: write # push to GHCR
      contents: read # checkout code
    runs-on: ubuntu-latest
    needs: goreleaser # only runs if GoReleaser succeeds

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Docker login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        run: |
          VERSION=${{ needs.goreleaser.outputs.version }}
          docker buildx build \
            --target serverbeacon-api \
            --platform linux/amd64,linux/arm64 \
            -t "ghcr.io/redjax/serverbeacon-api:${VERSION}" \
            -t "ghcr.io/redjax/serverbeacon-api:latest" \
            --push .

      - name: Build & push CLI image
        run: |
          VERSION=${{ needs.goreleaser.outputs.version }}
          docker buildx build \
            --target serverbeacon \
            --platform linux/amd64,linux/arm64 \
            -t "ghcr.io/redjax/serverbeacon:${VERSION}" \
            -t "ghcr.io/redjax/serverbeacon:latest" \
            --push .
