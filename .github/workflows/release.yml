---
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump level (major/minor/patch), or leave empty for auto"
        required: false
        type: choice
        options:
          - ""
          - major
          - minor
          - patch
        default: ""

permissions: {}

jobs:
  ## Build & release Go apps
  goreleaser:
    permissions:
      contents: write # git tag creation
      issues: write # changelog links
      pull-requests: write # changelog links
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version & create tag
        id: version
        run: |
          ## Get latest version
          CURRENT=$(git tag --list --sort=-version:refname | head -1)
          [[ -z "$CURRENT" ]] && CURRENT="v0.0.0"

          echo "Latest tag: ${CURRENT}"

          BUMP="${{ github.event.inputs.bump }}"

          ## Bump X.0.0
          if [[ "$BUMP" == "major" ]]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "${CURRENT#v}"
            [[ -z "$MAJOR" ]] && MAJOR=0
            VERSION="v$((MAJOR + 1)).0.0"

          ## Bump 0.X.0
          elif [[ "$BUMP" == "minor" ]]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "${CURRENT#v}"
            [[ -z "$MAJOR" ]] && MAJOR=0
            VERSION="v${MAJOR}.$((MINOR + 1)).0"

          ## Bump 0.0.X
          elif [[ "$BUMP" == "patch" ]]; then
            IFS='.' read -r MAJOR MINOR PATCH <<< "${CURRENT#v}"
            [[ -z "$MAJOR" ]] && MAJOR=0
            VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"

          ## Detect patch/minor/major bump from commits
          else
            if [[ "$CURRENT" == "v0.0.0" ]]; then
              COMMITS=$(git log --pretty=format:"%s")
            else
              COMMITS=$(git log ${CURRENT}..HEAD --pretty=format:"%s")
            fi
            
            COMMIT_COUNT=$(echo "$COMMITS" | grep -v '^$' | wc -l)
            if [[ $COMMIT_COUNT -eq 0 ]]; then
              echo "No commits since last tag. Nothing to release."
              exit 1
            fi
            
            echo "Commits since $CURRENT:"
            echo "$COMMITS"
            
            ## feat(): commits = minor
            if echo "$COMMITS" | grep -qE "^feat(\\(.+\\))?:"; then
              echo "Found 'feat:' commits, bumping minor"
              IFS='.' read -r MAJOR MINOR PATCH <<< "${CURRENT#v}"
              VERSION="v${MAJOR}.$((MINOR + 1)).0"

            ## fix(): commits = patch
            elif echo "$COMMITS" | grep -qE "^fix(\\(.+\\))?:"; then
              echo "Found 'fix:' commits, bumping patch"
              IFS='.' read -r MAJOR MINOR PATCH <<< "${CURRENT#v}"
              VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"

            ## No feat() or fix() commit detected
            else
              echo "⚠️ No 'feat:' or 'fix:' commits found:"
              echo "$COMMITS"
              echo "Use conventional commits: feat: ..., fix: ..."
              exit 1
            fi
          fi

          echo "Parsed: MAJOR=$MAJOR MINOR=$MINOR PATCH=$PATCH"
          echo "New version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          ## Force tag to current commit
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION" || true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: "release --clean"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ## Build Docker images
  docker:
    permissions:
      packages: write # push to GHCR
      contents: read # checkout code
    runs-on: ubuntu-latest
    needs: goreleaser # only runs if GoReleaser succeeds

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Docker login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        run: |
          VERSION=${{ needs.goreleaser.outputs.version }}
          docker buildx build \
            --target serverbeacon-api \
            --platform linux/amd64,linux/arm64 \
            -t "ghcr.io/redjax/serverbeacon-api:${VERSION}" \
            -t "ghcr.io/redjax/serverbeacon-api:latest" \
            --push .

      - name: Build & push CLI image
        run: |
          VERSION=${{ needs.goreleaser.outputs.version }}
          docker buildx build \
            --target serverbeacon \
            --platform linux/amd64,linux/arm64 \
            -t "ghcr.io/redjax/serverbeacon:${VERSION}" \
            -t "ghcr.io/redjax/serverbeacon:latest" \
            --push .
