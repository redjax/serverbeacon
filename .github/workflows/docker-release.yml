---
name: Release Docker container

on:
  push:
    ## Publish semver tags as releases
    tags: ["v*.*.*"]

  pull_request:
    branches: ["main"]

  workflow_dispatch: {}
  workflow_call: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      api-digest: ${{ steps.api.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build serverbeacon-api
        id: api
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: serverbeacon-api:build
          outputs: type=image,name=api-digest,push=true,registry=${{ env.REGISTRY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: sigstore/cosign-installer@v4.1.0

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker image metadata
        id: meta-api
        uses: docker/metadata-action@v6
        with:
          images: ${{ github.repository_owner }}/serverbeacon-api

      - name: Push and sign serverbeacon-api
        env:
          DIGEST: ${{ needs.build.outputs.api-digest }}
          TAGS: ${{ steps.meta-api.outputs.tags }}
        run: |
          docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/serverbeacon-api@$DIGEST
          echo "$TAGS" | xargs -I {} docker tag ${{ env.REGISTRY }}/${{ github.repository_owner }}/serverbeacon-api@$DIGEST {}
          echo "$TAGS" | xargs -I {} docker push {}
          echo "$TAGS" | xargs -I {} cosign sign {}@$DIGEST
